<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Panic - ก๊วนความจำ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- นำเข้า Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fef3c7;
            color: #451a03;
            -webkit-tap-highlight-color: transparent;
        }
        .card-flip { transition: transform 0.2s ease; }
        .card-flip:active { transform: scale(0.95); }
        .pulse-text { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 50; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .toast {
            padding: 12px 24px; border-radius: 999px; color: white; font-weight: bold;
            opacity: 0; animation: fadeinout 3.5s forwards; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 1.1rem;
        }
        @keyframes fadeinout {
            0% { opacity: 0; transform: translateY(-20px); }
            10% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <header class="bg-amber-800 text-amber-50 p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-lg md:text-2xl font-bold flex items-center gap-2">
            ☕ Cafe Panic <span class="text-xs md:text-sm bg-orange-500 text-white px-2 py-1 rounded-full">ก๊วนความจำ</span>
        </h1>
        <div id="statsBar" class="hidden font-semibold flex-col items-end text-sm md:text-base">
            <div id="levelDisplay">เลเวล: 1</div>
            <div id="livesDisplay" class="text-red-400">❤️❤️❤️</div>
        </div>
    </header>

    <div id="toast-container"></div>

    <main id="gameContainer" class="flex-grow flex flex-col items-center justify-center p-2 md:p-4 w-full max-w-4xl mx-auto">
        <!-- ล็อคอินเริ่มต้น -->
        <div class="text-center bg-white p-8 rounded-2xl shadow-xl max-w-md w-full" id="initialScreen">
            <div class="text-6xl mb-4">🏪</div>
            <h2 class="text-2xl font-bold mb-4 text-amber-900">Cafe Panic</h2>
            <p id="connectionStatus" class="text-gray-500 mb-4 animate-pulse">กำลังรอเชื่อมต่อเซิร์ฟเวอร์...</p>
            <input type="text" id="playerName" placeholder="พิมพ์ชื่อของคุณ..." maxlength="15"
                class="w-full border-2 border-amber-300 rounded-xl p-3 text-lg mb-4 focus:outline-none focus:border-amber-500 text-center" disabled>
            <button id="joinBtn" onclick="joinGame()" class="w-full bg-gray-400 text-white font-bold py-3 px-6 rounded-xl text-lg shadow-lg cursor-not-allowed" disabled>
                เข้าสู่ร้าน
            </button>
        </div>
    </main>

    <script>
        const socket = io();
        let clientState = { status: 'lobby', players: {} }; // ค่าเริ่มต้นเผื่อไว้
        let myId = null;

        const container = document.getElementById('gameContainer');
        const statsBar = document.getElementById('statsBar');
        const levelDisplay = document.getElementById('levelDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const toastContainer = document.getElementById('toast-container');

        socket.on('connect', () => {
            myId = socket.id;
            const statusEl = document.getElementById('connectionStatus');
            const nameInput = document.getElementById('playerName');
            const joinBtn = document.getElementById('joinBtn');
            
            if(statusEl) {
                statusEl.innerText = 'เชื่อมต่อสำเร็จแล้ว! กรุณาใส่ชื่อ';
                statusEl.classList.remove('animate-pulse');
                statusEl.classList.add('text-green-600');
            }
            if(nameInput) { nameInput.disabled = false; nameInput.focus(); }
            if(joinBtn) {
                joinBtn.disabled = false;
                joinBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                joinBtn.classList.add('bg-amber-600', 'hover:bg-amber-700');
            }
            render();
        });
        
        socket.on('disconnect', () => showToast('ขาดการเชื่อมต่อกับเซิร์ฟเวอร์!', 'wrong'));
        socket.on('error_msg', (msg) => showToast(msg, 'wrong'));

        socket.on('state_update', (newState) => {
            clientState = newState;

            // แสดง/ซ่อน แถบข้อมูลเลเวลและหัวใจ
            if (['reader_phase', 'turn_phase', 'level_clear', 'game_over'].includes(clientState.status)) {
                statsBar.classList.remove('hidden');
                levelDisplay.innerText = `เลเวล: ${clientState.level}`;
                let hearts = '';
                for(let i=0; i<clientState.maxLives; i++) {
                    hearts += i < clientState.lives ? '❤️' : '🖤';
                }
                livesDisplay.innerText = hearts;
            } else {
                statsBar.classList.add('hidden');
            }

            render();
        });

        socket.on('play_event', (event) => {
            showToast(event.msg, event.type);
            if (event.type === 'wrong') {
                document.body.classList.add('bg-red-200');
                setTimeout(() => document.body.classList.remove('bg-red-200'), 200);
            } else if (event.type === 'correct') {
                document.body.classList.add('bg-green-100');
                setTimeout(() => document.body.classList.remove('bg-green-100'), 200);
            }
        });

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'correct' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.innerText = message;
            toastContainer.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3500);
        }

        function joinGame() {
            const nameInput = document.getElementById('playerName')?.value.trim();
            if (nameInput) socket.emit('join_game', nameInput);
            else alert("กรุณาใส่ชื่อของคุณ!");
        }

        function startGame() { socket.emit('start_game'); }
        function nextLevel() { socket.emit('next_level'); }
        function returnToLobby() { socket.emit('return_lobby'); }
        function guessItem(item) { socket.emit('guess_item', item); }
        function readerReady() { socket.emit('reader_ready'); }

        function render() {
            if (!container) return;

            // 1. เช็คสำคัญ: ถ้ายังไม่ได้ล็อคอิน (ไม่มีชื่อในระบบ) ให้บังคับแสดงหน้าล็อคอินเสมอ!
            if (!myId || !clientState.players[myId]) {
                 if(!document.getElementById('initialScreen')) {
                     container.innerHTML = `
                        <div class="text-center bg-white p-8 rounded-2xl shadow-xl max-w-md w-full" id="initialScreen">
                            <div class="text-6xl mb-4">🏪</div>
                            <h2 class="text-2xl font-bold mb-4 text-amber-900">Cafe Panic</h2>
                            <p class="text-green-600 mb-4">เข้าสู่ระบบสำเร็จ! กรุณาใส่ชื่อ</p>
                            <input type="text" id="playerName" placeholder="พิมพ์ชื่อของคุณ..." maxlength="15"
                                class="w-full border-2 border-amber-300 rounded-xl p-3 text-lg mb-4 focus:outline-none focus:border-amber-500 text-center">
                            <button onclick="joinGame()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded-xl text-lg shadow-lg">
                                เข้าสู่ร้าน
                            </button>
                        </div>`;
                 }
                 return;
            }

            let html = '';
            const amIHost = clientState.players[myId]?.isHost;

            // 2. หน้าล็อบบี้รอก่อนเริ่มเกม
            if (clientState.status === 'lobby') {
                const playersArray = Object.values(clientState.players);
                html = `
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl max-w-lg w-full text-center">
                        <h2 class="text-2xl font-bold mb-2 text-amber-900">ห้องพักพนักงาน</h2>
                        <p class="text-gray-500 mb-4">รอเพื่อนเข้าห้อง (${playersArray.length}/10)</p>
                        
                        <div class="flex flex-col gap-2 mb-6 max-h-48 overflow-y-auto">
                            ${playersArray.map(p => `
                                <div class="flex items-center justify-between bg-amber-50 p-2 rounded-lg border border-amber-100 text-left px-4">
                                    <div class="font-semibold text-amber-800 flex items-center gap-2">
                                        ${p.id === myId ? '(คุณ) ' : ''}${p.name} 
                                        ${p.isHost ? '<span class="text-xs bg-yellow-400 text-yellow-900 px-2 py-1 rounded-full">หัวหน้า</span>' : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        ${amIHost ? `
                            <p class="text-sm text-gray-500 mb-4">รอให้เพื่อนเข้ามาครบทุกคนก่อน ค่อยกดเริ่มเกมนะครับ</p>
                            <button onclick="startGame()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg transition-transform transform hover:scale-105">เริ่มเกมเลย!</button>
                        ` : `
                            <div class="p-4 bg-gray-100 rounded-xl text-gray-500 font-semibold animate-pulse border border-gray-200">
                                รอหัวหน้าห้องกดเริ่มเกม...
                            </div>
                        `}
                    </div>
                `;
            } 
            
            // 3. ช่วงอ่านออเดอร์
            else if (clientState.status === 'reader_phase') {
                const isAmReader = clientState.readerId === myId;
                const readerName = clientState.players[clientState.readerId]?.name || 'ผู้เล่น';
                html = `
                    <div class="text-center w-full max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
                        <h2 class="text-2xl md:text-3xl font-bold mb-2 text-amber-900">
                            ${isAmReader ? '🎤 คุณคือผู้อ่านออเดอร์!' : `🎤 รอ ${readerName} อ่านออเดอร์`}
                        </h2>
                        ${isAmReader ? `
                            <p class="text-gray-600 mb-6 font-medium">อ่านรายการทั้งหมดนี้ให้เพื่อนฟังใน Discord (เรียงยังไงก็ได้)</p>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">
                                ${(clientState.targetItems || []).map(item => `<div class="bg-amber-100 border-2 border-amber-300 rounded-xl p-3 shadow-sm text-lg font-semibold text-center text-amber-900">${item}</div>`).join('')}
                            </div>
                            <button onclick="readerReady()" class="w-full max-w-md mx-auto block bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg pulse-text">อ่านเสร็จแล้ว! แจกการ์ดเลย</button>
                        ` : `
                            <div class="py-12 flex flex-col items-center justify-center">
                                <div class="text-6xl mb-4 shake">🎧</div>
                                <p class="text-xl text-gray-700 font-semibold">ตั้งใจฟังใน Discord ให้ดี!</p>
                                <p class="text-gray-500 mt-2">เมื่อ ${readerName} อ่านจบและกดเริ่มเกม การ์ดจะถูกแจกให้ทุกคน</p>
                            </div>
                        `}
                    </div>
                `;
            }

            // 4. ช่วงทายทีละคิว (Turn Phase)
            else if (clientState.status === 'turn_phase') {
                const currentPlayerId = clientState.turnOrder[clientState.currentTurnIndex];
                const isMyTurn = currentPlayerId === myId;
                const currentSpeakerName = clientState.players[currentPlayerId]?.name || 'ผู้เล่น';
                const myHand = clientState.playerHands[myId] || [];

                html = `
                    <div class="flex flex-col w-full h-full gap-4">
                        
                        <!-- แถบแสดงคิวการเล่น -->
                        <div class="bg-white p-3 rounded-xl shadow-sm overflow-x-auto whitespace-nowrap scrollbar-hide border-b-4 border-amber-200">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-gray-500 text-sm mr-2">ลำดับคิว:</span>
                                ${(clientState.turnOrder || []).map((id, index) => {
                                    const pName = clientState.players[id]?.name || '???';
                                    const isCurrent = index === clientState.currentTurnIndex;
                                    let badgeStyle = "bg-gray-100 text-gray-500 border-gray-200"; 
                                    if (isCurrent) badgeStyle = "bg-blue-500 text-white border-blue-600 scale-110 shadow-md font-bold"; 
                                    return `<div class="px-3 py-1 rounded-full border-2 text-sm transition-all ${badgeStyle}">${index + 1}. ${pName} ${isCurrent ? '🗣️' : ''}</div>`;
                                }).join('')}
                            </div>
                        </div>

                        <!-- พื้นที่หลัก -->
                        <div class="flex-grow flex flex-col md:flex-row gap-4 h-full">
                            
                            <!-- การ์ดในมือของฉัน -->
                            <div class="w-full md:w-1/3 bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 flex flex-col items-center shadow-inner relative overflow-hidden">
                                <h3 class="font-bold text-amber-900 mb-4 text-lg border-b-2 border-amber-300 pb-2 w-full text-center">✋ การ์ดในมือคุณ</h3>
                                <div class="flex flex-col gap-3 w-full max-h-64 overflow-y-auto">
                                    ${myHand.length === 0 ? '<p class="text-gray-400 text-center text-sm">ไม่มีการ์ดในรอบนี้</p>' : ''}
                                    ${myHand.map(item => {
                                        const isGuessed = clientState.guessedCorrectly.includes(item);
                                        return `<div class="p-3 rounded-lg border-2 text-center font-semibold text-lg transition-all ${isGuessed ? 'bg-green-100 border-green-300 text-green-700 opacity-60' : 'bg-white border-amber-400 shadow-sm text-amber-900'}">${item} ${isGuessed ? '✅' : ''}</div>`;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- กระดานกดทาย -->
                            <div class="w-full md:w-2/3 bg-white rounded-2xl p-4 md:p-6 shadow-xl flex flex-col relative border-t-8 ${isMyTurn ? 'border-blue-400' : 'border-amber-400'}">
                                <div class="text-center mb-6">
                                    <h2 class="text-2xl font-bold ${isMyTurn ? 'text-blue-600' : 'text-amber-900'}">
                                        ${isMyTurn ? '🗣️ ถึงคิวคุณแล้ว!' : `🎧 กำลังรอ: ${currentSpeakerName} ตัดสินใจ`}
                                    </h2>
                                    <p class="text-gray-600 mt-1 font-medium">
                                        ${isMyTurn ? 'ถามเพื่อนใน Discord ซิว่า "ใครมีเมนูนี้บ้าง?" แล้วกดเลือกเลย' : 'รอเพื่อนถาม แล้วถ้ามี ให้รีบตอบ!'}
                                    </p>
                                </div>

                                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 flex-grow overflow-y-auto pr-2 pb-2">
                                    ${(clientState.shuffledOptions || []).map(item => {
                                        const isGuessedGlobally = clientState.guessedCorrectly.includes(item);
                                        const isWrongGlobally = clientState.wrongGuesses?.includes(item);
                                        const isMyCard = myHand.includes(item);
                                        
                                        let btnClass = "bg-gray-50 hover:bg-amber-100 border-2 border-gray-200 text-gray-700 card-flip";
                                        let disabledAttr = "";

                                        if (isGuessedGlobally) {
                                            btnClass = "bg-green-500 text-white border-green-600 opacity-50"; disabledAttr = "disabled";
                                        } else if (isWrongGlobally) {
                                            btnClass = "bg-red-500 text-white border-red-600 opacity-50 scale-95"; disabledAttr = "disabled";
                                        } else if (!isMyTurn) {
                                            // ไม่ใช่ตาฉัน ห้ามกด
                                            btnClass = "bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed"; disabledAttr = "disabled";
                                        } else if (isMyTurn && isMyCard) {
                                            // ตาฉัน แต่เป็นไพ่ตัวเอง ห้ามกด!
                                            btnClass = "bg-amber-100 text-amber-300 border-amber-200 cursor-not-allowed opacity-50"; disabledAttr = "disabled";
                                        }

                                        return `<button onclick="guessItem('${item}')" ${disabledAttr} class="${btnClass} p-3 rounded-xl shadow-sm text-sm md:text-base font-semibold text-center transition-colors break-words">${item}</button>`;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 5. จบด่าน / จบเกม
            else if (clientState.status === 'level_clear') {
                html = `
                    <div class="text-center bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-4 border-green-400">
                        <div class="text-6xl mb-4">🎉</div>
                        <h2 class="text-3xl font-bold mb-2 text-green-600">สุดยอด! หาออเดอร์เจอครบ</h2>
                        <p class="mb-6 text-gray-600">ความจำดีกันมาก เตรียมพร้อมลุยความวุ่นวายระดับต่อไป</p>
                        ${amIHost 
                            ? `<button onclick="nextLevel()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg transition-transform transform hover:scale-105">ไปเลเวล ${clientState.level + 1} ➔</button>` 
                            : `<div class="p-4 bg-gray-100 rounded-xl text-gray-500 font-semibold animate-pulse">รอหัวหน้าห้องกดไปด่านต่อไป...</div>`
                        }
                    </div>
                `;
            }
            else if (clientState.status === 'game_over') {
                html = `
                    <div class="text-center bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-4 border-red-500">
                        <div class="text-6xl mb-4">😭</div>
                        <h2 class="text-3xl font-bold mb-2 text-red-600">คาเฟ่พังยับ!</h2>
                        <p class="mb-6 text-gray-600">ทายผิดจนลูกค้าหนีหมด<br>ทีมเรามาไกลถึง <b>เลเวล ${clientState.level}</b></p>
                        
                        <div class="mb-6 text-left">
                            <h3 class="font-bold text-gray-700">เฉลย ออเดอร์ที่ถูกต้องคือ:</h3>
                            <ul class="text-sm text-gray-600 mt-2 list-disc list-inside">
                                ${(clientState.targetItems || []).map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>

                        ${amIHost 
                            ? `<button onclick="returnToLobby()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-6 rounded-xl text-xl shadow-lg transition-transform transform hover:scale-105 mb-2">กลับหน้าล็อบบี้</button>
                               <button onclick="startGame()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl text-lg shadow-sm">เริ่มเล่นใหม่เลย</button>` 
                            : `<div class="p-4 bg-gray-100 rounded-xl text-gray-500 font-semibold animate-pulse">รอหัวหน้าห้องตัดสินใจ...</div>`
                        }
                    </div>
                `;
            }

            container.innerHTML = html;
        }

    </script>
</body>
</html>
